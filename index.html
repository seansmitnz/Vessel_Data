<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vessel Data Entry</title>
    <!-- Robust, modern jsPDF library link to prevent script freezes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --primary: #ff6600;       /* Vibrant Orange */
            --primary-hover: #ff8533; /* Lighter Orange */
            --background: #121212;    /* Deep Matte Black */
            --card-bg: #1a1a1a;       /* Solid Jet Black */
            --text: #ffffff;          /* White text */
            --text-muted: #a3a3a3;    /* Muted grey */
            --border: #333333;        /* Dark grey */
            --border-focus: #ff6600;  /* Orange focus */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            border: 1px solid #262626;
        }

        h2 {
            color: var(--primary);
            margin-bottom: 24px;
            text-align: center;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 16px;
            transition: all 0.2s ease;
            -webkit-appearance: none;
            background-color: #222222;
            color: var(--text);
        }

        ::placeholder {
            color: var(--text-muted);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://w3.org' viewBox='0 0 24 24' fill='none' stroke='%23ff6600' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 40px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px rgba(255, 102, 0, 0.2);
        }

        input[readonly] {
            background-color: #151515;
            color: var(--primary);
            border-style: dashed;
            cursor: not-allowed;
            font-weight: bold;
        }

        .grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        button, .wa-btn {
            width: 100%;
            background-color: var(--primary);
            color: #000000;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
            text-transform: uppercase;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        button:hover, .wa-btn:hover {
            background-color: var(--primary-hover);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-box {
            background: #1a1a1a;
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.3);
        }

        .modal-box p {
            margin-bottom: 20px;
            font-size: 16px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            .grid-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Vessel Data Report</h2>
        
        <form id="vesselForm" onsubmit="generatePDFAndPrepareWhatsApp(event)">
            
            <div class="form-group">
                <label for="vesselName">Vessel Name</label>
                <input type="text" id="vesselName" required placeholder="Enter vessel name">
            </div>

            <div class="grid-row">
                <div class="form-group">
                    <label for="vesselLength">Vessel Length (m)</label>
                    <input type="number" step="0.1" id="vesselLength" required placeholder="e.g. 15.5">
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
            </div>

            <div class="grid-row">
                <div class="form-group">
                    <label for="slingType">Sling Type</label>
                    <select id="slingType" required>
                        <option value="" disabled selected>Select...</option>
                        <option value="Short">Short</option>
                        <option value="Long">Long</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="numSlings">Number of Slings</label>
                    <select id="numSlings" required>
                        <option value="" disabled selected>Select...</option>
                        <option value="Single">Single</option>
                        <option value="Double">Double</option>
                    </select>
                </div>
            </div>

            <div class="grid-row">
                <div class="form-group">
                    <label for="weightFwd">Weight FWD (tons)</label>
                    <input type="number" step="0.01" id="weightFwd" required placeholder="0.00" oninput="calculateTotal()">
                </div>

                <div class="form-group">
                    <label for="weightAft">Weight AFT (tons)</label>
                    <input type="number" step="0.01" id="weightAft" required placeholder="0.00" oninput="calculateTotal()">
                </div>
            </div>

            <div class="form-group">
                <label for="weightTotal">Weight Total (Calculated)</label>
                <input type="number" step="0.01" id="weightTotal" readonly placeholder="0.00">
            </div>

            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea id="notes" placeholder="Enter any additional details here..."></textarea>
            </div>

            <button type="submit">Generate PDF & Report</button>
        </form>
    </div>

    <div class="modal-overlay" id="waModal">
        <div class="modal-box">
            <h3 style="color: var(--primary); margin-bottom: 12px; text-transform: uppercase;">PDF Saved!</h3>
            <p>The formal PDF document has been downloaded to your device files. Tap below to share the summary block directly to your target contact or group.</p>
            <a href="#" id="waLink" class="wa-btn" target="_blank">Open WhatsApp</a>
        </div>
    </div>

    <script>
        document.getElementById('date').valueAsDate = new Date();

        function calculateTotal() {
            const fwd = parseFloat(document.getElementById('weightFwd').value) || 0;
            const aft = parseFloat(document.getElementById('weightAft').value) || 0;
            const total = fwd + aft;
            document.getElementById('weightTotal').value = total > 0 ? total.toFixed(2) : "";
        }

        function generatePDFAndPrepareWhatsApp(event) {
            event.preventDefault();

            // Fetch data entries
            const vesselName = document.getElementById('vesselName').value;
            const vesselLength = document.getElementById('vesselLength').value;
            const date = document.getElementById('date').value;
            const slingType = document.getElementById('slingType').value;
            const numSlings = document.getElementById('numSlings').value;
            const weightFwd = document.getElementById('weightFwd').value;
            const weightAft = document.getElementById('weightAft').value;
            const weightTotal = document.getElementById('weightTotal').value;
            const notes = document.getElementById('notes').value || "None";

            try {
                // Safeguarded Initialization Pattern for jsPDF
                const { jsPDF } = window.jspdf ? window.jspdf : window;
Use code with caution.
const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
// Design Title
doc.setFont("helvetica", "bold");
doc.setFontSize(22);
doc.setTextColor(255, 102, 0);
doc.text("VESSEL DATA REPORT", 20, 25);
// Separator Rule Line
doc.setDrawColor(200, 200, 200);
doc.setLineWidth(0.5);
doc.line(20, 32, 190, 32);
// Setup content block printing
doc.setFont("helvetica", "normal");
doc.setFontSize(12);
doc.setTextColor(30, 30, 30);
let yPosition = 45;
const rowHeight = 10;
const printRow = (label, value) => {
doc.setFont("helvetica", "bold");
doc.text(label, 20, yPosition);
doc.setFont("helvetica", "normal");
doc.text(String(value), 65, yPosition);
yPosition += rowHeight;
};
printRow("Vessel Name:", vesselName);
printRow("Vessel Length:", vesselLength + " meters");
printRow("Report Date:", date);
yPosition += 5;
printRow("Sling Type:", slingType);
printRow("No. of Slings:", numSlings);
yPosition += 5;
printRow("Weight FWD:", weightFwd + " tons");
printRow("Weight AFT:", weightAft + " tons");
doc.setFont("helvetica", "bold");
doc.text("Weight TOTAL:", 20, yPosition);
doc.setTextColor(255, 102, 0);
doc.text(weightTotal + " tons", 65, yPosition);
doc.setTextColor(30, 30, 30);
yPosition += 15;
doc.setFont("helvetica", "bold");
doc.text("Notes / Remarks:", 20, yPosition);
doc.setFont("helvetica", "normal");
yPosition += 7;
const splitNotes = doc.splitTextToSize(notes, 170);
doc.text(splitNotes, 20, yPosition);
// Build & trigger PDF download
const sanitizedFilename = Vessel_Report_${vesselName.replace(/[^a-z0-9]/gi, '_')}.pdf;
doc.save(sanitizedFilename);
} catch (err) {
console.error("PDF Generation failed, bypassing directly to WhatsApp launcher:", err);
}
// --- WhatsApp Integration Link Loader ---
const message = *⚓ VESSEL DATA REPORT ⚓*\n\n +
*Vessel Name:* ${vesselName}\n +
*Length:* ${vesselLength}m\n +
*Date:* ${date}\n\n +
*Sling Type:* ${slingType}\n +
*No. of Slings:* ${numSlings}\n\n +
*Weight TOTAL:* ${weightTotal} tons\n\n +
_(Full formal PDF downloaded to your device files)_;
const secureUrl = https://wa.me{encodeURIComponent(message)};
const btnLink = document.getElementById('waLink');
btnLink.href = secureUrl;
// Open popup interaction element
document.getElementById('waModal').style.display = 'flex';
btnLink.onclick = function() {
setTimeout(() => {
document.getElementById('waModal').style.display = 'none';
document.getElementById('vesselForm').reset();
document.getElementById('date').valueAsDate = new Date();
}, 300);
};
}
