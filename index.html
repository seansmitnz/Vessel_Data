<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vessel Data Entry</title>
    <style>
        :root {
            --primary: #ff6600;       /* Vibrant Orange */
            --primary-hover: #ff8533; /* Lighter Orange */
            --background: #121212;    /* Deep Matte Black */
            --card-bg: #1a1a1a;       /* Solid Jet Black */
            --text: #ffffff;          /* White text */
            --text-muted: #a3a3a3;    /* Muted grey */
            --border: #333333;        /* Dark grey */
            --border-focus: #ff6600;  /* Orange focus */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            border: 1px solid #262626;
        }

        h2 {
            color: var(--primary);
            margin-bottom: 24px;
            text-align: center;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 16px;
            transition: all 0.2s ease;
            -webkit-appearance: none;
            background-color: #222222;
            color: var(--text);
        }

        ::placeholder {
            color: var(--text-muted);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://w3.org' viewBox='0 0 24 24' fill='none' stroke='%23ff6600' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 40px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px rgba(255, 102, 0, 0.2);
        }

        input[readonly] {
            background-color: #151515;
            color: var(--primary);
            border-style: dashed;
            cursor: not-allowed;
            font-weight: bold;
        }

        .grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: #000000;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
            text-transform: uppercase;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            .grid-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Vessel Data Report</h2>
        
        <form id="vesselForm" onsubmit="sendToWhatsApp(event)">
            
            <div class="form-group">
                <label for="vesselName">Vessel Name</label>
                <input type="text" id="vesselName" required placeholder="Enter vessel name">
            </div>

            <div class="grid-row">
                <div class="form-group">
                    <label for="vesselLength">Vessel Length (m)</label>
                    <input type="number" step="0.1" id="vesselLength" required placeholder="e.g. 15.5">
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
            </div>

            <div class="grid-row">
                <div class="form-group">
                    <label for="slingType">Sling Type</label>
                    <select id="slingType" required>
                        <option value="" disabled selected>Select...</option>
                        <option value="Short">Short</option>
                        <option value="Long">Long</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="numSlings">Number of Slings</label>
                    <select id="numSlings" required>
                        <option value="" disabled selected>Select...</option>
                        <option value="Single">Single</option>
                        <option value="Double">Double</option>
                    </select>
                </div>
            </div>

            <div class="grid-row">
                <div class="form-group">
                    <label for="weightFwd">Weight FWD (tons)</label>
                    <input type="number" step="0.01" id="weightFwd" required placeholder="0.00" oninput="calculateTotal()">
                </div>

                <div class="form-group">
                    <label for="weightAft">Weight AFT (tons)</label>
                    <input type="number" step="0.01" id="weightAft" required placeholder="0.00" oninput="calculateTotal()">
                </div>
            </div>

            <div class="form-group">
                <label for="weightTotal">Weight Total (Calculated)</label>
                <input type="number" step="0.01" id="weightTotal" readonly placeholder="0.00">
            </div>

            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea id="notes" placeholder="Enter any additional details here..."></textarea>
            </div>

            <button type="submit">Submit to WhatsApp</button>
        </form>
    </div>

    <script>
        // Set today's date by default
        document.getElementById('date').valueAsDate = new Date();

        function calculateTotal() {
            const fwd = parseFloat(document.getElementById('weightFwd').value) || 0;
            const aft = parseFloat(document.getElementById('weightAft').value) || 0;
            const total = fwd + aft;
            document.getElementById('weightTotal').value = total > 0 ? total.toFixed(2) : "";
        }

        function sendToWhatsApp(event) {
            event.preventDefault(); // Prevents the browser page from refreshing

            // Fetch values from the inputs
            const vesselName = document.getElementById('vesselName').value;
            const vesselLength = document.getElementById('vesselLength').value;
            const date = document.getElementById('date').value;
            const slingType = document.getElementById('slingType').value;
            const numSlings = document.getElementById('numSlings').value;
            const weightFwd = document.getElementById('weightFwd').value;
            const weightAft = document.getElementById('weightAft').value;
            const weightTotal = document.getElementById('weightTotal').value;
            const notes = document.getElementById('notes').value || "None";

            // Construct structured message text block using markdown bolding
            const message = `*⚓ VESSEL DATA REPORT ⚓*\n\n` +
                            `*Vessel Name:* ${vesselName}\n` +
                            `*Length:* ${vesselLength}m\n` +
                            `*Date:* ${date}\n\n` +
                            `*Sling Type:* ${slingType}\n` +
                            `*No. of Slings:* ${numSlings}\n\n` +
                            `*Weight FWD:* ${weightFwd} tons\n` +
                            `*Weight AFT:* ${weightAft} tons\n` +
                            `*Weight TOTAL:* ${weightTotal} tons\n\n` +
                            `*Notes:* ${notes}`;

            // Create a universal link. Omitting the phone number parameter forces 
            // WhatsApp to open a picker so the user can select any Contact, Group, or Community.
            const whatsappUrl = `https://whatsapp.com{encodeURIComponent(message)}`;

            // Launch the chat app interface
            window.open(whatsappUrl, '_blank');
        }
    </script>

</body>
</html>
